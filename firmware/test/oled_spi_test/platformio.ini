; SSD1309 2.42" I2C test — hem Arduino IDE hem PlatformIO
;
; Arduino IDE : bu klasörü aç (oled_i2c_test.ino)
; PlatformIO  : pio run            (derle)
;               pio run -t upload  (yükle)
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    olikraus/U8g2@^2.35.30
