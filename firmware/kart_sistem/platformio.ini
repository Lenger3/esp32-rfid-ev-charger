; EVCHARGE-01 kartli sarj sistemi
; ESP32-WROOM-32U + M242 OLED (I2C) + RC522
;
; PLATFORM 8.0.0 ZORUNLU (arduino-esp32 3.3.12)
; Sebep: AP + STA + NAPT (WiFi.AP.enableNAPT) icin CONFIG_LWIP_IPV4_NAPT gerekir.
; 6.13.0 (arduino 2.0.17) bu ayari icermez -> esp_netif_napt_enable yok.

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; esptool 5.x + CH340/macOS: 921600'de acilista termios (22, Invalid argument)
; hatasi veriyor. 115200 her surucude guvenli; yukleme ~20 sn daha uzun.
upload_speed = 115200
board_build.filesystem = littlefs
; 3 MB uygulama alani (varsayilan 1.2 MB yetmiyor: TLS + ArduinoJson)
; OTA YOK — ileride OTA gerekirse min_spiffs.csv'ye gecilmeli
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    olikraus/U8g2@^2.35.30
    miguelbalboa/MFRC522@^1.4.11
    bblanchon/ArduinoJson@^7.2.1
    https://github.com/F1chter/LynkTuyaLocal.git#1.1.0
